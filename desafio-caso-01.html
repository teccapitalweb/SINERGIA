.dt-eco { position: absolute; z-index: 1; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px solid rgba(255, 255, 255, .85); border-radius: 50%; pointer-events: none; animation: dt-eco .7s ease-out forwards; }

@keyframes dt-eco { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(1.6); } }
.dt-pista-txt { min-height: 24px; margin-top: 10px; color: var(--d-muted); font-size: 14px; }
.dt-acciones { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 16px; }
.dt-sub { font: 800 13px var(--font-display, 'Plus Jakarta Sans', sans-serif); letter-spacing: .08em; text-transform: uppercase; color: var(--d-subtle); }
.dt-lista { display: grid; gap: 8px; margin: 0; padding-left: 22px; color: var(--d-muted); }

/* Conclusión */
.dt-tarjeta { display: grid; gap: 14px; padding: clamp(18px, 3vw, 28px); border: 1.5px solid var(--d-border); border-radius: 24px; background: var(--d-card); box-shadow: var(--d-shadow); }

.dt-op .dt-letra { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--d-soft); font: 800 14px var(--font-display, 'Plus Jakarta Sans', sans-serif); }

/* Cierre */
.dt-cierre { position: relative; display: grid; justify-items: center; gap: 14px; padding: clamp(26px, 5vw, 48px) 20px; border-radius: 28px; text-align: center; color: #fff; background: #0F3B33; isolation: isolate; overflow: hidden; box-shadow: var(--d-shadow); }
.dt-cierre::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(rgba(8, 32, 27, .86), rgba(8, 32, 27, .92)), url(assets/detective/caso-01-el-rastro-que-no-cuadra.webp) center / cover no-repeat; }
.dt-sello { display: grid; place-items: center; width: 92px; height: 92px; border: 3px solid #E7C873; border-radius: 50%; background: rgba(231, 200, 115, .16); animation: dt-sello .9s cubic-bezier(.2, 1.3, .4, 1) both; }
.dt-sello svg { width: 52px; height: 52px; fill: none; stroke: #E7C873; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.dt-resumen li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 16px; background: rgba(255, 255, 255, .1); font-weight: 700; }

.dt-xp { display: inline-flex; padding: 9px 18px; border-radius: 100px; background: #E7C873; color: #3B2D07; font: 800 15px var(--font-display, 'Plus Jakarta Sans', sans-serif); }
.dt-xp--quieto { background: rgba(255, 255, 255, .16); color: #fff; }

@media (max-width: 960px) {

}

/* ══════════ Desafío SINERGIA · Misión 01 ══════════ */
/* Cabecera con la portada del caso (sin texto dentro de la imagen) y degradado verde profundo del lado del texto */
.dr-hero { position: relative; margin-bottom: 18px; border-radius: 24px; overflow: hidden; color: #fff; background: #0F3B33 url(retos-desafio-sinergia/caso-01-la-ruta-de-las-tres-pistas.png) center / cover no-repeat; box-shadow: var(--d-shadow); isolation: isolate; }
.dr-hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(8, 45, 38, .95) 0%, rgba(8, 45, 38, .8) 40%, rgba(8, 45, 38, .12) 100%); }
.dr-hero .dt-cab { margin: 0; padding: clamp(20px, 4vw, 36px); min-height: 200px; align-items: center; }
.dr-hero h1 { margin-top: 10px; }
.dr-hero .dt-cab p { color: rgba(255, 255, 255, .92); }
.dr-hero .dt-etq { background: rgba(255, 255, 255, .16); color: #fff; }
.dr-hero .dt-contador { border-color: rgba(255, 255, 255, .45); background: rgba(8, 45, 38, .55); color: #fff; }

.dr-pasos { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; padding: 0; list-style: none; }
.dr-pasos li { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border: 1.5px solid var(--d-border); border-radius: 100px; background: var(--d-card); font: 700 12.5px var(--font-display, 'Plus Jakarta Sans', sans-serif); color: var(--d-subtle); }

.dr-pasos li span svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.dr-pasos li.es-actual { border-color: var(--d-accent); color: var(--d-text); }
.dr-pasos li.es-actual span { background: var(--d-accent); color: #fff; }
.dr-pasos li.es-hecho span { background: var(--d-primary); color: var(--d-on-primary); }
.dr-barra { height: 6px; margin: 0 0 18px; border-radius: 100px; background: var(--d-border); overflow: hidden; }
.dr-barra span { display: block; height: 100%; border-radius: 100px; background: linear-gradient(90deg, var(--d-accent), var(--d-gold)); transition: width .4s ease; }
.dr-caso { display: grid; gap: 18px; max-width: 1040px; }
.dr-momento { font: 800 12.5px var(--font-display, 'Plus Jakarta Sans', sans-serif); letter-spacing: .1em; text-transform: uppercase; color: var(--d-subtle); }

.dr-voces { display: grid; gap: 12px; }
.dr-voz { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; }
.dr-voz img { display: block; width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--d-soft); border: 2px solid var(--d-border); }
.dr-voz div { padding: 12px 16px; border: 1.5px solid var(--d-border); border-radius: 18px; border-top-left-radius: 6px; background: var(--d-soft); }
.dr-voz b { display: block; font: 800 12.5px var(--font-display, 'Plus Jakarta Sans', sans-serif); letter-spacing: .06em; text-transform: uppercase; color: var(--d-subtle); }
.dr-voz p { margin-top: 2px; font-weight: 600; }
.dr-voz--ines div { background: color-mix(in srgb, var(--d-accent) 10%, var(--d-card)); border-color: color-mix(in srgb, var(--d-accent) 45%, var(--d-border)); }

/* Momento 1: bandeja de avisos y dos columnas */
.dr-bandeja { display: grid; gap: 10px; padding: 14px; border: 1.5px dashed var(--d-border); border-radius: 20px; background: var(--d-soft); }
.dr-bandeja > h3, .dr-col > h3 { font: 800 12.5px var(--font-display, 'Plus Jakarta Sans', sans-serif); letter-spacing: .08em; text-transform: uppercase; color: var(--d-subtle); }
.dr-notas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.dr-notas:empty::after { content: "Ya clasificaste todos los avisos."; grid-column: 1 / -1; color: var(--d-muted); font-weight: 600; }
#detective .dr-nota { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; min-height: 64px; padding: 14px 16px; border: 2px solid var(--d-border); border-left: 6px solid var(--d-gold); border-radius: 16px; background: var(--d-card); text-align: left; font-weight: 600; box-shadow: 0 8px 18px -12px rgba(17, 61, 53, .5); cursor: grab; }
#detective .dr-nota:hover { border-color: var(--d-accent); border-left-color: var(--d-gold); }
#detective .dr-nota[aria-pressed="true"] { border-color: var(--d-accent); border-left-color: var(--d-accent); background: var(--d-ok-bg); box-shadow: 0 0 0 4px color-mix(in srgb, var(--d-accent) 25%, transparent); }
#detective .dr-nota.es-arrastrando { opacity: .45; }
.dr-nota .dt-letra, .dr-chip .dt-letra { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--d-soft); font: 800 14px var(--font-display, 'Plus Jakarta Sans', sans-serif); }
.dr-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.dr-col { display: grid; gap: 10px; align-content: start; min-height: 150px; padding: 14px; border: 2px dashed var(--d-border); border-radius: 20px; background: var(--d-card); }
.dr-col--ev { border-color: color-mix(in srgb, var(--d-accent) 55%, var(--d-border)); }
.dr-col.es-sobre { border-style: solid; border-color: var(--d-accent); background: var(--d-ok-bg); }
.dr-col h3 { color: var(--d-text); }
.dr-col--ev h3 { color: var(--d-link); }
.dr-col-lista { display: grid; gap: 8px; }
#detective .dr-chip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; padding: 10px 12px; border: 1.5px solid var(--d-border); border-radius: 14px; background: var(--d-soft); text-align: left; font-weight: 600; font-size: 15px; }
#detective .dr-chip:hover:not(:disabled) { border-color: var(--d-accent); }
#detective .dr-chip:disabled { cursor: default; }
#detective .dr-chip.es-ok { border-color: var(--d-accent); background: var(--d-ok-bg); }
#detective .dr-poner { min-height: 48px; border: 1.5px dashed var(--d-border); border-radius: 12px; background: transparent; font-weight: 700; color: var(--d-subtle); }
#detective .dr-poner:not(:disabled):hover { border-color: var(--d-accent); color: var(--d-text); }
#detective .dr-poner:disabled { opacity: .55; cursor: default; }
.dr-expl { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.dr-expl li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 10px 14px; border: 1.5px solid var(--d-accent); border-radius: 14px; background: var(--d-ok-bg); font-size: 15px; }
.dr-expl b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--d-accent); color: #fff; font: 800 13px var(--font-display, 'Plus Jakarta Sans', sans-serif); }

/* Momento 2: avisos incompletos y preguntas (se eligen dos) */
.dr-incompletos { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.dr-incompletos li { padding: 10px 14px; border: 1.5px dashed color-mix(in srgb, var(--d-gold) 70%, var(--d-border)); border-radius: 14px; background: color-mix(in srgb, var(--d-gold) 12%, var(--d-card)); font-weight: 600; }
.dr-incompletos small { display: block; color: var(--d-subtle); font-weight: 700; }
.dr-preguntas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
#detective .dr-aviso { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 84px; padding: 14px 16px; border: 2px solid var(--d-border); border-radius: 18px; background: var(--d-card); text-align: left; font: 700 16.5px/1.35 var(--font-display, 'Plus Jakarta Sans', sans-serif); box-shadow: var(--d-shadow); }
#detective .dr-aviso:hover:not(:disabled) { border-color: var(--d-accent); background: var(--d-soft); }
#detective .dr-aviso:disabled { cursor: default; }
.dr-aviso .dt-letra { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--d-soft); font: 800 15px var(--font-display, 'Plus Jakarta Sans', sans-serif); }
.dr-aviso .dr-aviso-s { display: grid; place-items: center; width: 28px; height: 28px; border: 2px solid var(--d-border); border-radius: 8px; background: var(--d-card); }
.dr-aviso .dr-aviso-s svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
#detective .dr-aviso.es-sel { border-color: var(--d-accent); background: var(--d-ok-bg); }

#detective .dr-aviso.es-ok { border-color: var(--d-accent); background: var(--d-ok-bg); box-shadow: inset 0 0 0 1px var(--d-accent); }
#detective .dr-aviso.es-despues { opacity: .8; }

/* Momento 3: mesa de evidencia */
.dr-mesa { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.dr-pieza { display: grid; gap: 8px; align-content: start; padding: 12px; border: 1.5px solid var(--d-border); border-radius: 18px; background: var(--d-card); box-shadow: var(--d-shadow); font-size: 14.5px; font-weight: 600; }
.dr-pieza--ev { border-color: var(--d-accent); background: color-mix(in srgb, var(--d-accent) 8%, var(--d-card)); }
.dr-pieza--dato { border-style: dashed; border-color: color-mix(in srgb, var(--d-gold) 80%, var(--d-border)); background: color-mix(in srgb, var(--d-gold) 12%, var(--d-card)); }

.dr-pieza em { justify-self: start; padding: 3px 10px; border-radius: 100px; font: 800 11px var(--font-display, 'Plus Jakarta Sans', sans-serif); font-style: normal; letter-spacing: .06em; text-transform: uppercase; }
.dr-pieza--ev em { background: var(--d-accent); color: #fff; }
.dr-pieza--dato em { background: var(--d-gold); color: #3B2D07; }

/* Cierre */
.dt-cierre::before { background: linear-gradient(rgba(8, 32, 27, .88), rgba(8, 32, 27, .94)), url(retos-desafio-sinergia/caso-01-la-ruta-de-las-tres-pistas.png) center / cover no-repeat, #0F3B33; }
.dr-insignia { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 18px; background: rgba(255, 255, 255, .12); border: 1.5px solid rgba(231, 200, 115, .7); }
.dr-insignia svg { width: 34px; height: 34px; fill: none; stroke: #E7C873; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.dr-ruta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(760px, 100%); margin: 6px 0; padding: 0; list-style: none; counter-reset: ruta; }
.dr-ruta li { position: relative; display: grid; justify-items: center; align-content: start; gap: 6px; padding: 14px 8px; border: 1px solid rgba(255, 255, 255, .28); border-radius: 16px; background: rgba(255, 255, 255, .1); font-weight: 800; font-size: 14.5px; }
.dr-ruta li::before { counter-increment: ruta; content: counter(ruta); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #7ED3C3; color: #06241D; font: 800 14px var(--font-display, 'Plus Jakarta Sans', sans-serif); }
.dr-ruta li + li::after { content: "→"; position: absolute; left: -10px; top: 50%; transform: translate(-50%, -50%); color: #E7C873; font-size: 16px; }
.dr-ruta li:last-child { border-color: #E7C873; background: rgba(231, 200, 115, .16); }
.dr-ruta li:last-child::before { background: #E7C873; color: #3B2D07; }
.dr-etq-resuelto { padding: 6px 16px; border: 1px solid rgba(255, 255, 255, .35); border-radius: 100px; background: rgba(255, 255, 255, .1); font-weight: 800; }
.dr-resultado { font-weight: 800; color: #E7C873; }

.dr-notas--una { grid-template-columns: 1fr; }
.dr-cols--3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dr-ubicada { display: grid; gap: 6px; }
.dr-fb-ubicada { margin: 0; padding: 0 4px; font-size: 13.5px; color: var(--d-muted); }
.dr-cols--lectura .dr-col { min-height: 0; border-style: solid; }
#detective span.dr-chip { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1.5px solid var(--d-border); border-radius: 14px; background: var(--d-soft); font-weight: 600; font-size: 15px; }
#detective span.dr-chip.es-ok { border-color: var(--d-accent); background: var(--d-ok-bg); }
.dr-logro { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; width: min(520px, 100%); padding: 12px 16px; border: 1.5px solid #E7C873; border-radius: 16px; background: rgba(231, 200, 115, .16); text-align: left; }
.dr-logro-i { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: rgba(255, 255, 255, .12); }
.dr-logro-i svg { width: 26px; height: 26px; fill: none; stroke: #E7C873; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.dr-logro b { display: block; color: #E7C873; }
.dr-logro small { display: block; max-width: none; color: rgba(255, 255, 255, .85); }

/* Hoja de la libreta de campo */
.dt3-hoja { position: relative; display: grid; gap: 4px; padding: 18px 20px 20px 34px; border: 1px solid color-mix(in srgb, var(--d-gold) 55%, var(--d-border)); border-radius: 18px; background-color: color-mix(in srgb, var(--d-gold) 12%, var(--d-card)); background-image: repeating-linear-gradient(transparent 0, transparent 35px, color-mix(in srgb, var(--d-accent) 28%, transparent) 35px, color-mix(in srgb, var(--d-accent) 28%, transparent) 36px); box-shadow: var(--d-shadow); }
.dt3-hoja::before { content: ""; position: absolute; top: 0; bottom: 0; left: 20px; width: 2px; background: color-mix(in srgb, var(--d-gold) 80%, transparent); }

.dt3-nota { font: 600 clamp(18px, 2.4vw, 22px)/1.5 var(--font-display, 'Plus Jakarta Sans', sans-serif); padding: 6px 0; }
.dt3-campo { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 40px; }
.dt3-campo > span { font: 800 12px var(--font-display, 'Plus Jakarta Sans', sans-serif); letter-spacing: .06em; text-transform: uppercase; color: var(--d-subtle); }

.dt3-falta { display: inline-block; padding: 4px 12px; border: 1.5px dashed color-mix(in srgb, var(--d-subtle) 65%, transparent); border-radius: 10px; color: var(--d-subtle); font-weight: 700; font-size: 14px; }
.dt3-llena { animation: dt-sube .45s ease both; color: var(--d-text); }
.dt3-completa { padding-top: 6px; font: 600 clamp(17px, 2.2vw, 20px)/1.5 var(--font-display, 'Plus Jakarta Sans', sans-serif); }

/* Armar el registro */
.dt3-huecos { display: grid; gap: 10px; }
#detective .dt3-hueco { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; min-height: 56px; padding: 8px 14px; border: 2px dashed color-mix(in srgb, var(--d-subtle) 60%, transparent); border-radius: 16px; background: color-mix(in srgb, var(--d-card) 78%, transparent); text-align: left; }

#detective .dt3-hueco[aria-pressed="true"] { border-color: var(--d-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--d-accent) 25%, transparent); }
.dt3-hueco > span { font: 800 12px var(--font-display, 'Plus Jakarta Sans', sans-serif); letter-spacing: .06em; text-transform: uppercase; color: var(--d-subtle); }
.dt3-hueco > em { font-style: normal; font-weight: 600; color: var(--d-subtle); }
.dt3-hueco > b { font-weight: 700; }
#detective .dt3-hueco.es-llena { border-style: solid; border-color: var(--d-accent); background: var(--d-card); }
#detective .dt3-hueco.es-ok { border-color: var(--d-accent); background: var(--d-ok-bg); }
#detective .dt3-hueco.es-sobre { border-color: var(--d-accent); background: var(--d-soft); }
.dt3-mano { display: flex; flex-wrap: wrap; gap: 10px; }
#detective .dt3-ficha { min-height: 48px; padding: 8px 16px; border: 2px solid var(--d-border); border-radius: 14px; background: var(--d-card); font-weight: 700; text-align: left; cursor: grab; box-shadow: 0 6px 16px -10px rgba(17, 61, 53, .45); }

#detective .dt3-ficha.es-arrastrando { opacity: .45; }
.dt3-mano:empty::after { content: "Ya colocaste todas las tarjetas."; color: var(--d-muted); font-weight: 600; }
.dt3-hoja { padding-left: 34px; }
/* Mapa de misión */
.dm-mapa { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 0; margin: 0 0 8px; padding: 0; list-style: none; }
.dm-mapa li { display: inline-flex; align-items: center; gap: 8px; font: 700 13px var(--font-display, 'Plus Jakarta Sans', sans-serif); color: var(--d-subtle); }
.dm-mapa li + li::before { content: ""; width: clamp(22px, 7vw, 80px); height: 3px; margin: 0 10px; border-radius: 2px; background: var(--d-border); }

.dm-n { display: grid; place-items: center; width: 32px; height: 32px; border: 2px dashed var(--d-border); border-radius: 50%; background: var(--d-card); font-weight: 800; }

.dm-mapa li.es-actual { color: var(--d-text); }
.dm-mapa li.es-actual .dm-n { border: 2px solid var(--d-accent); background: var(--d-accent); color: #fff; box-shadow: 0 0 0 5px color-mix(in srgb, var(--d-accent) 25%, transparent); }

.dm-instr { padding: 12px 16px; border: 1.5px solid var(--d-accent); border-radius: 16px; background: color-mix(in srgb, var(--d-accent) 8%, var(--d-card)); font-weight: 700; }

.dm-zona { cursor: pointer; }

/* Estación 2 */
.dm-conectables { display: flex; align-items: stretch; flex-wrap: wrap; gap: 0; margin: 0; padding: 0; list-style: none; }

.dm-hilo { align-self: center; width: clamp(16px, 4vw, 40px); height: 0; border-top: 3px dotted var(--d-accent); }
.dm-conexion { display: flex; align-items: stretch; flex-wrap: wrap; gap: 10px; margin: 6px 0 0; padding: 0; list-style: none; counter-reset: cx; animation: dt-sube .4s ease both; }
.dm-conexion li { position: relative; flex: 1 1 160px; padding: 12px 14px; border: 1.5px solid var(--d-accent); border-radius: 14px; background: var(--d-ok-bg); font-weight: 800; text-align: center; }

(function () {
  'use strict';
  var PANEL = 'vip-panel.html';
  function ir(destino) { location.href = PANEL + '#' + destino; }
  // El panel abre la pestaña que indique el ancla (#retos, #courses, #profile…)
  window.switchTab = function (tab) { ir(tab); };

  window.handleSesion = function () { ir('cerrar-sesion'); };
  window.sinergiaInstallApp = window.sinergiaInstallApp || function () {};
  window.toggleTheme = function () {
    var html = document.documentElement, oscuro = html.getAttribute('data-theme') === 'dark';
    if (oscuro) html.removeAttribute('data-theme'); else html.setAttribute('data-theme', 'dark');
    try { localStorage.setItem('sinergia_theme', oscuro ? 'light' : 'dark'); } catch (e) { /* sin almacenamiento */ }
  };
  // "Retos" activo en la barra lateral y en el menú móvil
  document.querySelectorAll('.nav-item[data-tab]').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-tab') === 'retos');
    b.addEventListener('click', function () { ir(b.getAttribute('data-tab')); });
  });
  document.querySelectorAll('.mobile-nav-item[data-tab]').forEach(function (b) {
    b.classList.remove('active');
    b.addEventListener('click', function () { ir(b.getAttribute('data-tab')); });
  });
  // Grupo "Herramientas de campo" plegable, como en el panel
  var gt = document.getElementById('navToolsGroupToggle'), gi = document.getElementById('navToolsItems');
  if (gt && gi) gt.addEventListener('click', function () { var a = gt.getAttribute('aria-expanded') === 'true'; gt.setAttribute('aria-expanded', a ? 'false' : 'true'); gi.classList.toggle('open', !a); gi.parentNode.classList.toggle('open', !a); });
  // Buscador: al pulsar Enter se abre el panel con la búsqueda
  var bus = document.getElementById('topbarSearchInput');
  if (bus) bus.addEventListener('keydown', function (e) { if (e.key === 'Enter' && bus.value.trim()) ir('buscar=' + encodeURIComponent(bus.value.trim())); });
  // Menú lateral del celular: se arma clonando la barra lateral, igual que en el panel
  window.abrirMobileDrawer = function () {
    var destino = document.querySelector('.mobile-drawer-content'), fuente = document.querySelector('.sidebar-nav');
    if (destino && fuente) {
      destino.innerHTML = '';
      Array.prototype.forEach.call(fuente.children, function (h) {
        var c = h.cloneNode(true);
        if (c.classList.contains('nav-item')) c.addEventListener('click', function () { ir(c.getAttribute('data-tab')); });
        destino.appendChild(c);
      });
    }
    var o = document.getElementById('mobileDrawerOverlay'), d = document.getElementById('mobileDrawer');
    if (o) o.classList.add('active'); if (d) d.classList.add('active');
    document.body.classList.add('mobile-drawer-open'); document.body.style.overflow = 'hidden';
  };

    var o = document.getElementById('mobileDrawerOverlay'), d = document.getElementById('mobileDrawer');

    document.body.classList.remove('mobile-drawer-open'); document.body.style.overflow = '';
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.cerrarMobileDrawer(); });
  // Nombre, plan e iniciales: los guarda el panel la última vez que se abrió (sinergia_shell_usuario)
  try {

  } catch (e) { /* sin datos de la cuenta */ }
})();

  /* ───────── Cuenta: XP semanal que paga el servidor ───────── */
  async function servidor(metodo, ruta, cuerpo) {

    var s = window.SinergiaJuegoSesion;
    if (!s) return { estado: 'sin-sesion' };
    try { await s.esperar(); } catch (e) { return { estado: 'sin-sesion' }; }

    try { tok = await s.token(); } catch (e) { /* sin sesión */ }
    if (!tok) return { estado: 'sin-sesion' };
    try {
      var resp = await fetch(s.backend + ruta, { method: metodo, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
      var datos = await resp.json().catch(function () { return {}; });

    } catch (e) { return { estado: 'error' }; }

      case 'xp': return { chip: '+' + res.xp + ' XP semanal', pie: 'Los XP de la misión cuentan una vez por semana. Tu avance se guarda en este dispositivo y los XP en tu cuenta.' };
      case 'ya-esta-semana': return { chip: base + ' · Ya recibiste los XP de esta semana', quieto: true, pie: 'Los XP de la misión cuentan una vez por semana: vuelven el ' + fechaLunes(res.proxima) + '.' };
      case 'sin-membresia': return { chip: '', pie: 'Los XP de las misiones se suman con una membresía activa. Tu avance se guarda en este dispositivo.' };
      case 'admin': return { chip: '', pie: 'Las cuentas de administración no suman XP. Tu avance se guarda en este dispositivo.' };
      case 'sin-sesion': return { chip: '', pie: 'Inicia sesión en el panel para sumar los XP de la misión (+' + XP + ' XP semanal). Por ahora tu avance se guarda solo en este dispositivo.' };
      case 'listo': return { chip: 'Esta semana: +' + XP + ' XP disponibles', quieto: true, pie: 'Repite la misión para sumarlos. Tu avance se guarda en este dispositivo.' };
      default: return { chip: '', pie: 'No pudimos confirmar tus XP ahora. Tu avance quedó en este dispositivo y se intentará de nuevo la próxima vez que entres.' };
    }
  }

  /* ───────── Cierre ───────── */
  function pintarCierre(res) {
    ultimoCierre = res || ultimoCierre;
    var t = textoXp(ultimoCierre);
    $('vistaCierre').innerHTML = '<div class="dt-cierre">' +
      '<div class="dr-insignia" aria-hidden="true">' + IC.ruta + '</div>' +
      '<span class="dr-etq-resuelto">Misión completada</span>' +
      '<h2 id="cierreTit" tabindex="-1">Conectaste las pistas con criterio.</h2>' +
      '<p class="dr-resultado">Resultado: Ruta de evidencia completada.</p>' +
      '<p>Observar, comparar y registrar no elimina todas las dudas; ayuda a hacer preguntas mejores antes de decidir.</p>' +
      '<ol class="dm-mapa dm-mapa--oscuro" aria-label="Estaciones terminadas">' + mapaHtml(4) + '</ol>' +
      (t.chip ? '<span class="dt-xp' + (t.quieto ? ' dt-xp--quieto' : '') + '">' + esc(t.chip) + '</span>' : '') +
      '<div class="dr-logro"><span class="dr-logro-i" aria-hidden="true">' + IC.ruta + '</span><span><b>' + (logroNuevo ? 'Insignia nueva · ' : 'Insignia · ') + 'Primera ruta SINERGIA</b><small>Conectaste observación, comparación y registro en una sola misión.</small></span></div>' +
      '<small>' + esc(t.pie) + '</small>' +
      (estado.ultimaEn ? '<p class="dt-nota">Última partida: ' + esc(fechaLarga(estado.ultimaEn)) + '.</p>' : '') +
      '<div class="dt-acciones"><a class="dt-btn dt-btn--claro" href="vip-panel.html#retos">Volver a Retos</a><button type="button" class="dt-btn dt-btn--sec" id="btnRepetir" style="color:#fff;border-color:rgba(255,255,255,.5)">Repetir misión</button></div></div>';
  }
  function mostrarCierre(res) {
    paso = 'cierre';
    $('vistaJuego').hidden = true; $('vistaCierre').hidden = false; $('cab').hidden = true; $('seguimiento').hidden = true;
    pintarCierre(res);
    window.scrollTo(0, 0);
    var h = $('cierreTit'); if (h) h.focus();
  }
  async function cerrarCaso() {
    var ahora = new Date().toISOString();
    erroresPartida = errores; jugadoAhora = true;
    var habia = !!(leerTodo().logros && leerTodo().logros.primeraRutaSinergia);
    estado.resuelto = true; estado.veces++; estado.resueltoEn = estado.resueltoEn || ahora; estado.ultimaEn = ahora;
    estado.mejorErrores = estado.mejorErrores === null ? errores : Math.min(estado.mejorErrores, errores);
    estado.pistas = PISTAS.map(function (p) { return p.id; });
    estado.registroFinal = { donde: 'linea-riego', que: 'suelo-oscuro', comparo: 'cama-cercana', fecha: ahora };
    guardar();
    marcarLogro(false); logroNuevo = !habia;
    mostrarCierre(null);
    var res = await pedirXp();
    pintarCierre(res);
  }
  function repetir() {
    errores = 0; ultimoCierre = null; halladas = []; campos = [null, null, null]; objetivo = null; logroNuevo = false;
    $('vistaCierre').hidden = true; $('vistaJuego').hidden = false; $('cab').hidden = false;
    cuentaInfo = null; pintarIntro(); consultarCuenta();
    window.scrollTo(0, 0); $('titulo').focus();
  }

  /* ───────── Eventos ───────── */
  document.addEventListener('click', function (e) {
    var det = $('detective');
    if (!det || !det.contains(e.target)) return;
    var t = e.target, b;
    if ((b = t.closest('[data-pista]')) && paso === 1) { verPista(b.getAttribute('data-pista')); return; }
    if (paso === 1 && t.closest('#escena')) { $('ficha').innerHTML = '<p class="dm-ficha-vacia">Ahí no hay nada que registrar todavía. Prueba con otra zona o usa la lista de pistas.</p>'; return; }
    if ((b = t.closest('[data-m2]')) && paso === 2) { elegirE2(Number(b.getAttribute('data-m2')), b); return; }
    if ((b = t.closest('[data-ficha]')) && paso === 3) { colocar(b.getAttribute('data-ficha')); return; }
    if ((b = t.closest('[data-hueco]')) && paso === 3) { quitar(Number(b.getAttribute('data-hueco'))); return; }
    if (t.closest('#btnEmpezar')) { errores = 0; irA(1); return; }
    if (t.closest('#btnSig1')) { irA(2); return; }
    if (t.closest('#btnSig2')) { irA(3); return; }
    if (t.closest('#btnRevisar3')) { revisarE3(); return; }
    if (t.closest('#btnCerrar')) { cerrarCaso(); return; }
    if (t.closest('#btnRepetir')) { repetir(); return; }
  });
  // Arrastrar y soltar (en pantallas táctiles se usa el toque)
  document.addEventListener('dragstart', function (e) {
    var f = e.target.closest && e.target.closest('[data-ficha]');
    if (!f || paso !== 3) return;
    arrastrada = f.getAttribute('data-ficha'); f.classList.add('es-arrastrando');
    try { e.dataTransfer.setData('text/plain', arrastrada); e.dataTransfer.effectAllowed = 'move'; } catch (x) { /* sin dataTransfer */ }
  });
  document.addEventListener('dragend', function (e) { arrastrada = null; var f = e.target.closest && e.target.closest('[data-ficha]'); if (f) f.classList.remove('es-arrastrando'); Array.prototype.forEach.call(document.querySelectorAll('.dt3-hueco.es-sobre'), function (h) { h.classList.remove('es-sobre'); }); });
  document.addEventListener('dragover', function (e) {
    var h = e.target.closest && e.target.closest('[data-hueco]');
    if (!h || !arrastrada || paso !== 3) return;
    e.preventDefault(); h.classList.add('es-sobre');
  });
  document.addEventListener('dragleave', function (e) { var h = e.target.closest && e.target.closest('[data-hueco]'); if (h) h.classList.remove('es-sobre'); });
  document.addEventListener('drop', function (e) {
    var h = e.target.closest && e.target.closest('[data-hueco]');
    if (!h || !arrastrada || paso !== 3) return;
    e.preventDefault();
    var id = arrastrada; arrastrada = null;
    colocar(id, Number(h.getAttribute('data-hueco')));
  });

  /* ───────── Inicio ───────── */
  async function consultarCuenta() {
    var r = await servidor('GET', '/api/retos/casos');
    cuentaInfo = r; if (paso === 'intro') pintarAvance();
    if (r.estado !== 'ok') { if (paso === 'cierre') pintarCierre({ tipo: r.estado === 'sin-sesion' ? 'sin-sesion' : 'error' }); return; }
    var c = r.datos.casos && r.datos.casos[ID];
    if (r.datos.logros && r.datos.logros.primeraRutaSinergia) marcarLogro(r.datos.logros.primeraRutaSinergia);   // el servidor ya lo tiene: queda también en este dispositivo
    if (paso === 'cierre') {
      if (estado.pendienteXp && !(c && c.cobradoEstaSemana)) { erroresPartida = estado.mejorErrores === null ? 0 : estado.mejorErrores; var res = await pedirXp(); pintarCierre(res); return; }
      if (!r.datos.miembro) pintarCierre({ tipo: r.datos.admin ? 'admin' : 'sin-membresia' });
      else if (c && c.cobradoEstaSemana) pintarCierre({ tipo: 'ya-esta-semana', proxima: r.datos.proximaRecompensa });
      else pintarCierre({ tipo: 'listo' });
    }
  }
  function iniciar() {
    if (paso === 'cierre') { $('vistaJuego').hidden = true; $('vistaCierre').hidden = false; $('cab').hidden = true; $('seguimiento').hidden = true; pintarCierre(null); consultarCuenta(); }
    else { pintarIntro(); consultarCuenta(); }
  }
  iniciar();
  window.addEventListener('juegoSesion', function () { if (paso === 'cierre') consultarCuenta(); });
})();
</script>
</body>
</html>
