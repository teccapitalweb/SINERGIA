<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Pago confirmado! | Curso Soluciones Nutritivas · Sinergia Agrícola</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
  === FACEBOOK PIXEL — EVENTO DE CONVERSIÓN ===
  Pega aquí el mismo snippet del Pixel que en index.html y agrega:
  fbq('track', 'Purchase', {value: 550, currency: 'MXN'});
  Este evento es el que Facebook Ads usa para optimizar la campaña por compras.

<style>
  :root{
    --base:#1a4d7a;--base-negro:#071e33;--acc:#4a8b3a;
    --hi:#d6e4f0;--crema:#d6e4f0;--ink:#0f1c26;--ink-soft:#4c6070;
    --line:rgba(15,28,38,.12);
  }
  *{box-sizing:border-box;margin:0;}
  body{
    font-family:'Inter',sans-serif;color:var(--ink);
    background:linear-gradient(170deg,#1a4d7a,var(--base-negro));
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px 16px;-webkit-font-smoothing:antialiased;
  }
  .card{
    background:#fff;border-radius:24px;max-width:520px;width:100%;
    padding:40px 28px;text-align:center;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.5);
  }
  .check{
    width:74px;height:74px;border-radius:50%;margin:0 auto 20px;
    background:linear-gradient(135deg,var(--acc),#6bb055);
    display:flex;align-items:center;justify-content:center;
    animation:pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  h1{font-family:'Archivo';font-size:clamp(1.5rem,6vw,2rem);font-weight:900;color:var(--base-negro);margin-bottom:10px;}
  .sub{color:var(--ink-soft);line-height:1.6;font-size:.98rem;margin-bottom:28px;}
  .steps{display:grid;gap:12px;text-align:left;margin-bottom:28px;}
  .step{
    display:flex;gap:14px;align-items:flex-start;
    background:#e7f0f8;border-radius:14px;padding:16px 18px;
  }
  .step-num{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;
    background:var(--base);color:#fff;font-family:'Archivo';font-weight:800;font-size:.85rem;
    display:flex;align-items:center;justify-content:center;
  }
  .step p{font-size:.9rem;line-height:1.5;color:var(--ink);}
  .step b{color:var(--base-negro);}
  .btn-wa{
    display:inline-flex;align-items:center;gap:10px;justify-content:center;
    background:#25D366;color:#fff;text-decoration:none;
    font-family:'Archivo';font-weight:800;font-size:1rem;
    padding:16px 28px;border-radius:14px;width:100%;
    box-shadow:0 12px 26px -8px rgba(37,211,102,.55);
    transition:transform .15s;
  }
  .btn-wa:hover{transform:translateY(-2px);}
  .foot{margin-top:22px;font-size:.78rem;color:var(--ink-soft);}
  .foot a{color:var(--base);font-weight:600;text-decoration:none;}
</style>
</head>
<body>
  <div class="card" id="g-card">
    <div class="check">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>¡Pago confirmado!</h1>
    <p class="sub" id="g-sub">Estamos abriendo tu curso <b>Elaboración de Soluciones Nutritivas para Cultivos</b>. No cierres esta ventana…</p>
    <div id="g-espera" style="margin:22px auto 6px;width:38px;height:38px;border-radius:50%;border:3.5px solid rgba(0,0,0,.1);border-top-color:var(--base);animation:g-giro .8s linear infinite"></div>
    <a id="g-entrar" hidden href="/campus/?curso=soluciones-nutritivas#/curso/soluciones-nutritivas"
       style="display:none;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:20px;padding:15px 20px;background:linear-gradient(135deg,var(--base),var(--acc));color:#fff;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none">
      Entrar a mi curso
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </a>
    <p class="foot">¿Algún problema con tu pago? Escríbenos al <a href="https://wa.me/522221035842">222 103 5842</a><br>© 2026 Sinergia Agrícola</p>
  </div>
  <style>@keyframes g-giro{to{transform:rotate(360deg)}}</style>
  <script type="module">
  /* Al volver de Stripe: confeti y entrada directa al curso en el Campus.
     El servidor confirma el pago con el session_id. Cuenta nueva: entra con un token de un solo uso.
     Si el correo ya tenía cuenta, entra con su acceso de siempre (se le manda su enlace al correo). */
  const CURSO = 'soluciones-nutritivas';
  const BACKEND = 'https://sinergia-webhook-production.up.railway.app';
  const DESTINO = '/campus/?curso=' + CURSO + '#/curso/' + CURSO;
  function confeti(){try{if(matchMedia('(prefers-reduced-motion: reduce)').matches||document.getElementById('sx-confeti'))return;var c=document.createElement('canvas');c.id='sx-confeti';c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2147483647';document.body.appendChild(c);var x=c.getContext('2d'),d=Math.min(window.devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;var col=['#f2b632','#22A05A','#1D6FD1','#ffffff','#ff7043','#86efac'],P=[];for(var i=0;i<160;i++)P.push({x:Math.random()*c.width,y:-Math.random()*c.height*.7,vx:(Math.random()-.5)*5*d,vy:(2+Math.random()*4)*d,w:(6+Math.random()*6)*d,h:(5+Math.random()*6)*d,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:col[i%col.length]});var t0=performance.now();(function f(t){var k=(t-t0)/5000;x.clearRect(0,0,c.width,c.height);x.globalAlpha=k>.75?Math.max(0,1-(k-.75)*4):1;P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.03*d;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(k<1)requestAnimationFrame(f);else c.remove()})(t0)}catch(e){}}
  const espera = (ms) => new Promise((r) => setTimeout(r, ms));
  function manual(texto) {
    document.getElementById('g-espera').style.display = 'none';
    if (texto) document.getElementById('g-sub').innerHTML = texto;
    const b = document.getElementById('g-entrar'); b.hidden = false; b.style.display = 'inline-flex';
  }
  async function entrar() {
    confeti();
    const sid = new URLSearchParams(location.search).get('session_id') || '';
    if (!/^cs_[A-Za-z0-9_]+$/.test(sid)) return manual('Tu acceso al curso <b>Elaboración de Soluciones Nutritivas para Cultivos</b> ya está activo.');
    try {
      let d = null;
      for (let i = 0; i < 9; i++) {
        const r = await fetch(BACKEND + '/campus/entrar-por-pago', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sid }) });
        d = await r.json().catch(() => ({}));
        if (r.status === 409 && d.pendiente) { await espera(2000); continue; }
        if (!r.ok) throw new Error(d.error || 'error');
        break;
      }
      if (!d || !d.pagado) throw new Error('pendiente');
      sessionStorage.setItem('campus_pago', JSON.stringify({ curso: CURSO, t: Date.now(), cuentaExistente: !!d.cuentaExistente, enlaceEnviado: !!d.enlaceEnviado }));
      if (d.entrada === 'token' && d.token) {
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
        const { getAuth, signInWithCustomToken, setPersistence, browserLocalPersistence } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
        const auth = getAuth(initializeApp({ apiKey: 'AIzaSyBDuTlF5zL0wDrOBhF-jOQLZWJiUtWRfG0', authDomain: 'sinergia-agricola-vip.firebaseapp.com', projectId: 'sinergia-agricola-vip', appId: '1:788533345154:web:4066de6561e1d54e2cad9b' }));
        await setPersistence(auth, browserLocalPersistence).catch(() => null);
        await signInWithCustomToken(auth, d.token);
      }
      await espera(900);            // que el confeti se alcance a ver
      location.replace(DESTINO);
    } catch (e) {
      manual('Tu pago quedó registrado. Entra a tu curso con el correo con el que pagaste.');
    }
  }
  entrar();
  </script>
</body>
</html>
