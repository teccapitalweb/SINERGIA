<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Alumno · Panel Sinergia</title>
  <link rel="stylesheet" href="admin.css?v=2">
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="pantallaLogin">
  <div class="login-caja">
    <h1>Panel de Sinergia</h1>
    <p>Acceso restringido. Entra con tu cuenta de Google.</p>
    <button class="btn-google" id="btnEntrar">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0012 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 010-4.18V7.07H2.18a11 11 0 000 9.86l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 00-9.82 6.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar con Google
    </button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ═══════ PANEL ═══════ -->
<div id="panel">
  <header class="topbar">
    <span class="topbar-marca">Sinergia <span>· Panel</span></span>
    <nav class="topbar-nav">
      <a href="index.html">Resumen</a>
      <a href="alumnos.html" class="activo">Alumnos</a>
      <a href="precios.html">Precios</a>
    </nav>
    <div class="topbar-user">
      <span class="topbar-email" id="emailAdmin"></span>
      <button class="btn-salir" id="btnSalir">Salir</button>
    </div>
  </header>

  <main class="contenido" id="detalle">
    <div class="cargando">Cargando…</div>
  </main>
</div>

<script type="module">
import { iniciarPanel, api, pesos, fecha, nombreCurso, esc, aviso, telefonoWa } from './admin.js';

const email = new URLSearchParams(location.search).get('email') || '';

iniciarPanel(async function () {
  const cont = document.getElementById('detalle');

  if (!email) {
    cont.innerHTML = '<div class="vacio">Falta el correo en la URL.</div>';
    return;
  }

  let r;
  try {
    r = await api('/admin/panel/alumnos/' + encodeURIComponent(email));
  } catch (e) {
    cont.innerHTML = `<div class="vacio">No encontramos a ese alumno.<br><a class="btn chico" style="margin-top:12px" href="alumnos.html">Volver</a></div>`;
    return;
  }

  const a = r.alumno;
  const wa = telefonoWa(a.telefono);

  const bloquesCurso = (a.cursos || []).map(curso => {
    const compra = (a.compras || []).filter(c => c.curso === curso).pop();
    const prog = (a.progreso || {})[curso];
    const pct = prog ? prog.porcentaje : 0;
    const modulos = Math.round((pct / 100) * 5);

    return `
      <div class="curso-bloque">
        <div class="curso-bloque-cab">
          <div>
            <h3>${esc(nombreCurso(curso))}</h3>
            <div class="curso-meta">
              ${compra
                ? `Comprado el ${fecha(compra.fecha)} · ${pesos(compra.monto)}`
                : 'Sin registro de compra'}
            </div>
          </div>
          <div>
            ${compra
              ? (compra.correoEnviado
                  ? '<span class="tag ok">correo enviado</span>'
                  : `<span class="tag error">correo falló</span>`)
              : ''}
            ${prog && prog.completado ? '<span class="tag oro">curso completado</span>' : ''}
          </div>
        </div>

        <div class="prog" style="margin-bottom:10px">
          <span class="prog-pista"><span class="prog-relleno" style="width:${pct}%"></span></span>
          <span class="prog-pct tnum">${pct}%</span>
        </div>
        <div class="curso-meta" style="margin-bottom:12px">
          ${modulos} de 5 módulos completados${
            prog && prog.actualizado ? ` · última actividad ${fecha(prog.actualizado)}` : ' · sin actividad'
          }
        </div>

        ${compra && !compra.correoEnviado && compra.correoError
          ? `<div class="curso-meta" style="color:#991b1b;margin-bottom:10px">Motivo del fallo: ${esc(compra.correoError)}</div>`
          : ''}

        <button class="btn chico" data-reenviar="${esc(curso)}">Reenviar correo de acceso</button>
      </div>`;
  }).join('');

  cont.innerHTML = `
    <a class="btn chico" href="alumnos.html" style="margin-bottom:16px">← Volver a alumnos</a>
    <h1 class="titulo-pagina">${esc(a.nombre || '(sin nombre)')}</h1>

    <section class="panel-caja">
      <div class="panel-cabecera"><h2>Datos</h2></div>
      <div class="panel-cuerpo">
        <div class="ficha">
          <div class="ficha-dato"><div class="etq">Correo</div><div class="val">${esc(a.email)}</div></div>
          <div class="ficha-dato"><div class="etq">Teléfono</div><div class="val tnum">${esc(a.telefono || '—')}</div></div>
          <div class="ficha-dato"><div class="etq">Alumno desde</div><div class="val tnum">${fecha(a.creado)}</div></div>
          <div class="ficha-dato"><div class="etq">Cursos</div><div class="val tnum">${(a.cursos || []).length}</div></div>
        </div>
      </div>
    </section>

    <section class="panel-caja">
      <div class="panel-cabecera"><h2>Sus cursos</h2></div>
      <div class="panel-cuerpo">
        ${bloquesCurso || '<div class="vacio">Sin cursos.</div>'}
      </div>
    </section>

    ${wa ? `<a class="btn-whatsapp" href="${wa}" target="_blank" rel="noopener">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.71.306 1.263.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884"/>
      </svg>
      Escribir por WhatsApp
    </a>` : '<div class="vacio">Sin teléfono para escribirle.</div>'}
  `;

  cont.querySelectorAll('[data-reenviar]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const curso = btn.dataset.reenviar;
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const res = await api(`/admin/panel/alumnos/${encodeURIComponent(a.email)}/reenviar-correo`, {
          method: 'POST',
          body: JSON.stringify({ curso })
        });
        aviso(res.ok ? `Correo reenviado a ${a.email}` : `Falló: ${res.error}`, !res.ok);
      } catch (e) {
        aviso('Error: ' + e.message, true);
      }
      btn.disabled = false;
      btn.textContent = 'Reenviar correo de acceso';
    });
  });
});
</script>

</body>
</html>
