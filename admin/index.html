<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Sinergia Agrícola</title>
  <link rel="stylesheet" href="admin.css?v=2">
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="pantallaLogin">
  <div class="login-caja">
    <h1>Panel de Sinergia</h1>
    <p>Acceso restringido. Entra con tu cuenta de Google.</p>
    <button class="btn-google" id="btnEntrar">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0012 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 010-4.18V7.07H2.18a11 11 0 000 9.86l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 00-9.82 6.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar con Google
    </button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ═══════ PANEL ═══════ -->
<div id="panel">
  <header class="topbar">
    <span class="topbar-marca">Sinergia <span>· Panel</span></span>
    <nav class="topbar-nav">
      <a href="index.html" class="activo">Resumen</a>
      <a href="alumnos.html">Alumnos</a>
      <a href="precios.html">Precios</a>
    </nav>
    <div class="topbar-user">
      <span class="topbar-email" id="emailAdmin"></span>
      <button class="btn-salir" id="btnSalir">Salir</button>
    </div>
  </header>

  <main class="contenido">
    <h1 class="titulo-pagina">Resumen</h1>

    <!-- Métricas -->
    <div class="metricas" id="metricas">
      <div class="metrica"><div class="metrica-etiqueta">Alumnos</div><div class="metrica-valor">—</div></div>
      <div class="metrica"><div class="metrica-etiqueta">Ingresos del mes</div><div class="metrica-valor">—</div></div>
      <div class="metrica"><div class="metrica-etiqueta">Compras</div><div class="metrica-valor">—</div></div>
      <div class="metrica"><div class="metrica-etiqueta">Completados</div><div class="metrica-valor">—</div></div>
    </div>

    <!-- Alertas -->
    <div class="alertas" id="alertas"></div>

    <!-- Ventas por curso -->
    <section class="panel-caja">
      <div class="panel-cabecera"><h2>Ventas por curso</h2></div>
      <div class="panel-cuerpo">
        <div class="barras" id="barras">
          <div class="cargando">Cargando…</div>
        </div>
      </div>
    </section>

    <!-- Últimas compras -->
    <section class="panel-caja">
      <div class="panel-cabecera">
        <h2>Últimas compras</h2>
        <a class="btn chico" href="alumnos.html">Ver todos</a>
      </div>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Alumno</th><th>Curso</th><th>Fecha</th><th>Monto</th><th>Correo</th>
            </tr>
          </thead>
          <tbody id="tbodyCompras">
            <tr><td colspan="5" class="cargando">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { iniciarPanel, api, pesos, fecha, nombreCurso, esc } from './admin.js';

iniciarPanel(async function () {
  const [resumen, alertas] = await Promise.all([
    api('/admin/panel/resumen'),
    api('/admin/panel/alertas')
  ]);

  // ── Métricas ──
  document.getElementById('metricas').innerHTML = `
    <div class="metrica">
      <div class="metrica-etiqueta">Alumnos</div>
      <div class="metrica-valor tnum">${resumen.alumnosTotales}</div>
      <div class="metrica-pie">registrados en total</div>
    </div>
    <div class="metrica">
      <div class="metrica-etiqueta">Ingresos del mes</div>
      <div class="metrica-valor tnum">${pesos(resumen.ingresosMes)}</div>
      <div class="metrica-pie">de ${pesos(resumen.ingresosTotales)} históricos</div>
    </div>
    <div class="metrica">
      <div class="metrica-etiqueta">Compras</div>
      <div class="metrica-valor tnum">${resumen.comprasTotales}</div>
      <div class="metrica-pie">inscripciones vendidas</div>
    </div>
    <div class="metrica">
      <div class="metrica-etiqueta">Completados</div>
      <div class="metrica-valor tnum">${resumen.completadosTotales}</div>
      <div class="metrica-pie">terminaron los 5 módulos</div>
    </div>`;

  // ── Alertas ──
  const cont = document.getElementById('alertas');
  const bloques = [];

  const lista = (items, render) =>
    `<ul>${items.slice(0, 20).map(render).join('')}</ul>` +
    (items.length > 20 ? `<p style="margin-top:8px">…y ${items.length - 20} más (están en el CSV)</p>` : '');

  if (alertas.correosFallidos.length) {
    bloques.push(`
      <div>
        <div class="alerta roja">
          <strong>${alertas.correosFallidos.length}</strong>
          alumno(s) no recibieron su correo de acceso
          <button class="alerta-accion" data-abre="detCorreos">Ver</button>
        </div>
        <div class="alerta-detalle" id="detCorreos">
          ${lista(alertas.correosFallidos, a => `<li><strong>${esc(a.nombre || a.email)}</strong> · ${esc(a.email)} · ${esc(nombreCurso(a.curso))} — ${esc(a.motivo)}</li>`)}
        </div>
      </div>`);
  }

  if (alertas.sinNombre.length) {
    bloques.push(`
      <div>
        <div class="alerta ambar">
          <strong>${alertas.sinNombre.length}</strong>
          compra(s) sin nombre capturado
          <button class="alerta-accion" data-abre="detNombres">Ver</button>
        </div>
        <div class="alerta-detalle" id="detNombres">
          ${lista(alertas.sinNombre, a => `<li>${esc(a.email)} · ${esc(a.telefono || 'sin teléfono')}</li>`)}
        </div>
      </div>`);
  }

  if (alertas.completadosSinCertificado.length) {
    bloques.push(`
      <div>
        <div class="alerta ambar">
          <strong>${alertas.completadosSinCertificado.length}</strong>
          alumno(s) terminaron el curso y no tienen certificado emitido
          <button class="alerta-accion" data-abre="detCerts">Ver</button>
        </div>
        <div class="alerta-detalle" id="detCerts">
          ${lista(alertas.completadosSinCertificado, a => `<li><strong>${esc(a.nombre || a.email)}</strong> · ${esc(nombreCurso(a.curso))}</li>`)}
        </div>
      </div>`);
  }

  cont.innerHTML = bloques.length
    ? bloques.join('')
    : '<div class="alerta ok">Todo en orden: ningún correo falló y no hay compras sin nombre.</div>';

  cont.querySelectorAll('[data-abre]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.dataset.abre)?.classList.toggle('visible');
    });
  });

  // ── Gráfica de ventas por curso ──
  const maxIngreso = Math.max(1, ...resumen.porCurso.map(c => c.ingresos));
  document.getElementById('barras').innerHTML = resumen.porCurso.map(c => `
    <div class="barra-fila">
      <span class="barra-nombre">${esc(nombreCurso(c.curso))}</span>
      <span class="barra-pista">
        <span class="barra-relleno" style="width:${(c.ingresos / maxIngreso) * 100}%"></span>
      </span>
      <span>
        <div class="barra-valor tnum">${pesos(c.ingresos)}</div>
        <div class="barra-sub tnum">${c.compras} compra(s) · ${c.completados} ✓</div>
      </span>
    </div>`).join('');

  // ── Últimas compras ──
  const tb = document.getElementById('tbodyCompras');
  tb.innerHTML = resumen.ultimasCompras.length
    ? resumen.ultimasCompras.map(c => `
      <tr>
        <td>
          <a href="alumno.html?email=${encodeURIComponent(c.email)}">
            <div class="celda-principal">${esc(c.nombre || '(sin nombre)')}</div>
            <div class="celda-tenue">${esc(c.email)}</div>
          </a>
        </td>
        <td><span class="tag">${esc(nombreCurso(c.curso))}</span></td>
        <td class="celda-tenue tnum">${fecha(c.fecha)}</td>
        <td class="tnum">${pesos(c.monto)}</td>
        <td>${c.correoEnviado
              ? '<span class="tag ok">enviado</span>'
              : '<span class="tag error">falló</span>'}</td>
      </tr>`).join('')
    : '<tr><td colspan="5" class="vacio">Todavía no hay compras.</td></tr>';
});
</script>

</body>
</html>
