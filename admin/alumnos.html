<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Alumnos · Panel Sinergia</title>
  <link rel="stylesheet" href="admin.css?v=3">
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="pantallaLogin">
  <div class="login-caja">
    <h1>Panel de Sinergia</h1>
    <p>Acceso restringido. Entra con tu cuenta de Google.</p>
    <button class="btn-google" id="btnEntrar">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0012 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 010-4.18V7.07H2.18a11 11 0 000 9.86l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 00-9.82 6.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar con Google
    </button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ═══════ PANEL ═══════ -->
<div id="panel">
  <header class="topbar">
    <span class="topbar-marca">Sinergia <span>· Panel</span></span>
    <nav class="topbar-nav">
      <a href="index.html">Resumen</a>
      <a href="alumnos.html" class="activo">Alumnos</a>
      <a href="precios.html">Precios</a>
    </nav>
    <div class="topbar-user">
      <span class="topbar-email" id="emailAdmin"></span>
      <button class="btn-salir" id="btnSalir">Salir</button>
    </div>
  </header>

  <main class="contenido">
    <h1 class="titulo-pagina">Alumnos</h1>
    <p class="subtitulo" id="conteo">—</p>

    <div class="herramientas">
      <label class="campo-buscar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input type="search" id="buscar" placeholder="Buscar por nombre, correo o teléfono…" autocomplete="off">
      </label>

      <select id="filtroCurso">
        <option value="">Todos los cursos</option>
        <option value="gerberas">gerberas</option>
        <option value="biofertilizantes">biofertilizantes</option>
        <option value="habanero">habanero</option>
        <option value="cana-de-azucar">caña de azúcar</option>
        <option value="soluciones-nutritivas">soluciones nutritivas</option>
      </select>

      <button class="btn verde" id="btnCsv">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
        </svg>
        Exportar CSV
      </button>
    </div>

    <section class="panel-caja">
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Cursos</th>
              <th>Progreso</th><th>Compró</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="7" class="cargando">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="paginacion">
        <span id="infoPagina">—</span>
        <div class="paginacion-btns">
          <button class="btn chico" id="btnPrev">Anterior</button>
          <button class="btn chico" id="btnNext">Siguiente</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script type="module">
import { iniciarPanel, api, descargarCsv, fecha, nombreCurso, esc, aviso, barraProgreso } from './admin.js';

let pagina = 1;
const POR_PAGINA = 50;

async function cargar() {
  const buscar = document.getElementById('buscar').value.trim();
  const curso = document.getElementById('filtroCurso').value;
  const tb = document.getElementById('tbody');
  tb.innerHTML = '<tr><td colspan="7" class="cargando">Cargando…</td></tr>';

  const q = new URLSearchParams({ pagina, porPagina: POR_PAGINA });
  if (buscar) q.set('buscar', buscar);
  if (curso) q.set('curso', curso);

  const r = await api('/admin/panel/alumnos?' + q.toString());

  document.getElementById('conteo').textContent =
    r.total === 0 ? 'Ningún alumno todavía' :
    r.total === 1 ? '1 alumno' : `${r.total} alumnos`;

  document.getElementById('infoPagina').textContent =
    r.total ? `Página ${r.pagina} de ${r.totalPaginas}` : '—';
  document.getElementById('btnPrev').disabled = r.pagina <= 1;
  document.getElementById('btnNext').disabled = r.pagina >= r.totalPaginas;

  if (!r.alumnos.length) {
    tb.innerHTML = `<tr><td colspan="7" class="vacio">${
      buscar || curso ? 'Ningún alumno coincide con el filtro.' : 'Todavía no hay alumnos.'
    }</td></tr>`;
    return;
  }

  tb.innerHTML = r.alumnos.map(a => {
    // Progreso: el del curso filtrado, o el más avanzado si no hay filtro.
    const entradas = Object.entries(a.progreso || {});
    const elegido = curso
      ? (a.progreso || {})[curso]
      : entradas.map(([, p]) => p).sort((x, y) => y.porcentaje - x.porcentaje)[0];

    const primeraCompra = (a.compras || [])
      .map(c => c.fecha).filter(Boolean).sort()[0];

    const falloCorreo = (a.compras || []).some(c => !c.correoEnviado);

    return `
      <tr>
        <td>
          <a href="alumno.html?email=${encodeURIComponent(a.email)}">
            <span class="celda-principal">${esc(a.nombre || '(sin nombre)')}</span>
          </a>
          ${falloCorreo ? '<span class="tag error" style="margin-left:6px">correo</span>' : ''}
        </td>
        <td class="celda-tenue">${esc(a.email)}</td>
        <td class="celda-tenue tnum">${esc(a.telefono || '—')}</td>
        <td>${(a.cursos || []).map(c => `<span class="tag">${esc(nombreCurso(c))}</span>`).join('') || '—'}</td>
        <td>${elegido ? barraProgreso(elegido.porcentaje) : '<span class="celda-tenue">sin empezar</span>'}</td>
        <td class="celda-tenue tnum">${fecha(primeraCompra)}</td>
        <td>
          <a class="btn chico" href="alumno.html?email=${encodeURIComponent(a.email)}">Ver</a>
          <button class="btn chico" data-reenviar="${esc(a.email)}" data-curso="${esc((a.cursos || [])[0] || '')}">Reenviar</button>
        </td>
      </tr>`;
  }).join('');

  tb.querySelectorAll('[data-reenviar]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const email = btn.dataset.reenviar;
      const curso = btn.dataset.curso;
      if (!curso) { aviso('Ese alumno no tiene cursos', true); return; }
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const res = await api(`/admin/panel/alumnos/${encodeURIComponent(email)}/reenviar-correo`, {
          method: 'POST',
          body: JSON.stringify({ curso })
        });
        aviso(res.ok ? `Correo reenviado a ${email}` : `Falló: ${res.error}`, !res.ok);
      } catch (e) {
        aviso('Error: ' + e.message, true);
      }
      btn.disabled = false;
      btn.textContent = 'Reenviar';
    });
  });
}

iniciarPanel(async function () {
  let t = null;
  document.getElementById('buscar').addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => { pagina = 1; cargar(); }, 300);
  });
  document.getElementById('filtroCurso').addEventListener('change', () => { pagina = 1; cargar(); });
  document.getElementById('btnPrev').addEventListener('click', () => { pagina--; cargar(); });
  document.getElementById('btnNext').addEventListener('click', () => { pagina++; cargar(); });

  document.getElementById('btnCsv').addEventListener('click', async (ev) => {
    const b = ev.currentTarget;
    b.disabled = true;
    try {
      const nombre = await descargarCsv();
      aviso('Descargado: ' + nombre);
    } catch (e) {
      aviso('No se pudo exportar: ' + e.message, true);
    }
    b.disabled = false;
  });

  await cargar();
});
</script>

</body>
</html>
